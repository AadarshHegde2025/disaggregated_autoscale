# This YAML is used to configure which VMs are designated in each group
- name: Autoscaler
  vm_numbers: [20]
  commands: ["cd disaggregated_autoscale", ""]

- name: Load Balancer
  vm_numbers: [19]
  commands: ["cd disaggregated_autoscale", ""]

- name: Memory heavy
  vm_numbers: [1, 2, 3, 4, 5, 6]
  commands: ["cd disaggregated_autoscale", "git switch main", "git pull"]  